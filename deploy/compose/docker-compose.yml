services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0.44}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-opshub}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MYSQL_PORT:-23306}:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - opshub-network

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${REDIS_PORT:-26390}:6379"
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - redis-data:/data
    networks:
      - opshub-network

  backend:
    image: ${BACKEND_REPOSITORY:-opshub-api}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-9876}:9876"
    environment:
      OPSHUB_SERVER_MODE: ${OPSHUB_SERVER_MODE:-release}
      OPSHUB_SERVER_HTTP_PORT: 9876
      OPSHUB_SERVER_JWT_SECRET: ${OPSHUB_SERVER_JWT_SECRET:-opshub-jwt-secret-change-in-production}
      OPSHUB_SERVER_EXTERNAL_URL: ${OPSHUB_SERVER_EXTERNAL_URL:-http://localhost:9876}
      OPSHUB_SERVER_FRONTEND_URL: ${OPSHUB_SERVER_FRONTEND_URL:-http://localhost}
      OPSHUB_DATABASE_HOST: mysql
      OPSHUB_DATABASE_PORT: 3306
      OPSHUB_DATABASE_DATABASE: ${MYSQL_DATABASE:-opshub}
      OPSHUB_DATABASE_USERNAME: ${MYSQL_USERNAME:-root}
      OPSHUB_DATABASE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      OPSHUB_REDIS_HOST: redis
      OPSHUB_REDIS_PORT: 6379
      OPSHUB_REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      OPSHUB_REDIS_DB: ${OPSHUB_REDIS_DB:-0}
      OPSHUB_DESKTOP_ENABLED: ${OPSHUB_DESKTOP_ENABLED:-false}
      OPSHUB_DESKTOP_PROVIDER: guacamole
      OPSHUB_DESKTOP_PUBLIC_PATH: ${OPSHUB_DESKTOP_PUBLIC_PATH:-/guacamole/}
      OPSHUB_DESKTOP_TOKEN_TTL_SECONDS: ${OPSHUB_DESKTOP_TOKEN_TTL_SECONDS:-30}
      OPSHUB_DESKTOP_JSON_SECRET_KEY: ${GUACAMOLE_JSON_SECRET_KEY:-7f2d4a9c1b6e8d0f5a3c7e1b9d4f6a2c}
      OPSHUB_DESKTOP_RECORDING_PATH: /var/lib/guacamole/recordings
      OPSHUB_DESKTOP_TRANSFER_ROOT_PATH: /var/lib/guacamole
      OPSHUB_DESKTOP_DRIVE_NAME: ${OPSHUB_DESKTOP_DRIVE_NAME:-OpsHub Files}
      OPSHUB_DESKTOP_DISABLE_UPLOAD: ${OPSHUB_DESKTOP_DISABLE_UPLOAD:-false}
      OPSHUB_DESKTOP_DISABLE_DOWNLOAD: ${OPSHUB_DESKTOP_DISABLE_DOWNLOAD:-false}
      OPSHUB_AGENT_ENABLED: ${OPSHUB_AGENT_ENABLED:-true}
      OPSHUB_AGENT_BUNDLE_DIR: /app/agent-bundles
      OPSHUB_AGENT_DEFAULT_INSTALL_PATH: ${OPSHUB_AGENT_DEFAULT_INSTALL_PATH:-/opt/opshub-agent}
      OPSHUB_AGENT_DEFAULT_LISTEN_PORT: ${OPSHUB_AGENT_DEFAULT_LISTEN_PORT:-19100}
      OPSHUB_AGENT_BINARY_NAME: ${OPSHUB_AGENT_BINARY_NAME:-opshub-agent}
      OPSHUB_AGENT_SERVICE_PREFIX: ${OPSHUB_AGENT_SERVICE_PREFIX:-opshub-agent}
      OPSHUB_AGENT_REPORT_INTERVAL_SECONDS: ${OPSHUB_AGENT_REPORT_INTERVAL_SECONDS:-60}
      OPSHUB_MONITORING_PROMETHEUS_ENABLED: ${OPSHUB_MONITORING_PROMETHEUS_ENABLED:-false}
      OPSHUB_MONITORING_PROMETHEUS_BASE_URL: ${OPSHUB_MONITORING_PROMETHEUS_BASE_URL:-http://prometheus:9090}
      OPSHUB_MONITORING_PROMETHEUS_FILE_SD_DIR: /app/data/prometheus/file_sd
      OPSHUB_MONITORING_PROMETHEUS_QUERY_TIMEOUT_SECONDS: ${OPSHUB_MONITORING_PROMETHEUS_QUERY_TIMEOUT_SECONDS:-10}
      OPSHUB_VIRTUALIZATION_SYNC_ENABLED: ${OPSHUB_VIRTUALIZATION_SYNC_ENABLED:-true}
      OPSHUB_VIRTUALIZATION_SYNC_INTERVAL_SECONDS: ${OPSHUB_VIRTUALIZATION_SYNC_INTERVAL_SECONDS:-60}
      OPSHUB_VIRTUALIZATION_SYNC_INITIAL_DELAY_SECONDS: ${OPSHUB_VIRTUALIZATION_SYNC_INITIAL_DELAY_SECONDS:-15}
      OPSHUB_VIRTUALIZATION_SYNC_PLATFORM_TIMEOUT_SECONDS: ${OPSHUB_VIRTUALIZATION_SYNC_PLATFORM_TIMEOUT_SECONDS:-300}
      OPSHUB_VIRTUALIZATION_SYNC_CONCURRENCY: ${OPSHUB_VIRTUALIZATION_SYNC_CONCURRENCY:-4}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./runtime/logs:/app/logs
      - ./runtime/guacamole:/var/lib/guacamole
      - ./runtime/prometheus/file_sd:/app/data/prometheus/file_sd
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9876/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - opshub-network

  frontend:
    image: ${FRONTEND_REPOSITORY:-opshub-web}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - opshub-network

  guacd:
    profiles: ["desktop"]
    image: ${GUACD_IMAGE:-guacamole/guacd:1.6.0}
    restart: unless-stopped
    volumes:
      - ./runtime/guacamole:/var/lib/guacamole
    networks:
      - opshub-network

  guacamole:
    profiles: ["desktop"]
    image: ${GUACAMOLE_IMAGE:-guacamole/guacamole:1.6.0}
    restart: unless-stopped
    depends_on:
      - guacd
    ports:
      - "${GUACAMOLE_PORT:-18080}:8080"
    environment:
      GUACD_HOSTNAME: guacd
      JSON_ENABLED: "true"
      JSON_SECRET_KEY: ${GUACAMOLE_JSON_SECRET_KEY:-7f2d4a9c1b6e8d0f5a3c7e1b9d4f6a2c}
      RECORDING_SEARCH_PATH: /var/lib/guacamole/recordings
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./runtime/guacamole:/var/lib/guacamole
    networks:
      - opshub-network

  prometheus:
    profiles: ["monitoring"]
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.54.1}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PROMETHEUS_PORT:-19090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./runtime/prometheus/file_sd:/etc/prometheus/file_sd
      - prometheus-data:/prometheus
    networks:
      - opshub-network

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local

networks:
  opshub-network:
    driver: bridge
