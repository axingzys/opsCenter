[barman]
barman_home = /var/lib/barman
barman_user = barman
log_file = /var/log/barman/barman.log
log_level = INFO
compression = gzip
configuration_files_directory = /etc/barman.d
retention_policy = REDUNDANCY 2
minimum_redundancy = 0

[pg-main]
description = OpsHub P3.10 PostgreSQL+Barman target time rehearsal
conninfo = host=127.0.0.1 port=55432 user=barman dbname=postgres password=barman
streaming_conninfo = host=127.0.0.1 port=55432 user=barman dbname=postgres password=barman
backup_method = postgres
streaming_archiver = on
archiver = off
slot_name = opshub_pitr_barman
create_slot = auto
path_prefix = /usr/lib/postgresql/16/bin
immediate_checkpoint = true
reuse_backup = off
